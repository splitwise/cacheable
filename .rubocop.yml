plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3

Layout/LineLength:
  Max: 120
  AllowedPatterns: ['#.*']
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Metrics/MethodLength:
  Max: 25

Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/PercentLiteralDelimiters:
  PreferredDelimiters:
    default: '()' # covers `%q`, `%Q`, `%s`, and `%x`
    '%r': '{}'
    '%w': '[]'
    '%W': '[]'
    '%i': '[]'
    '%I': '[]'
